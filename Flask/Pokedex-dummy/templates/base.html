<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>{% block title %}PokéDex{% endblock %}</title>
  <style>
    {% block style %}{% endblock %}
    
    /* Pokemon Type Colors */
    :root {
      --normal: #A8A878;
      --fire: #F08030;
      --water: #6890F0;
      --electric: #F8D030;
      --grass: #78C850;
      --ice: #98D8D8;
      --fighting: #C03028;
      --poison: #A040A0;
      --ground: #E0C068;
      --flying: #A890F0;
      --psychic: #F85888;
      --bug: #A8B820;
      --rock: #B8A038;
      --ghost: #705898;
      --dragon: #7038F8;
      --dark: #705848;
      --steel: #B8B8D0;
      --fairy: #EE99AC;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      background: linear-gradient(to right, #e2e2e2, beige);
      border: 1px solid beige;
      border-radius: 30px;
      margin: 10px 20px 10px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .header a {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: #000;
    }

    .header h1 {
      margin-left: 15px;
      margin-right: auto;
    }

    .nav-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      list-style: none;
      font-size: 1.2rem;
    }

    .nav-links li {
      cursor: pointer;
    }

    .nav-links li::after {
      content: '';
      width: 0%;
      height: 2px;
      background: #ff5555;
      display: block;
      margin: auto;
      transition: 0.5s;
    }

    .nav-links li:hover::after {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
        <a href="{{ url_for('index') }}">
            <img src="{{ url_for('static', filename='imgs/pokideximg.png') }}" alt="Pokeball" height="70px" width="70px">
            <h1>PokéDex</h1>
        </a>
        <ul class="nav-links">
            <a href="{{ url_for('index') }}"><li>Home</li></a>
            <a href="{{ url_for('types') }}"><li>Types</li></a>
            <a href="{{ url_for('search') }}"><li>Search</li></a>
        </ul>
    </div>
</div>
<div>
  {% block content %}
    
  {% endblock %}
</div>
</body>
</html>
