<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéDex Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: beige;
            background: linear-gradient(to right, #e2e2e2, beige);
            font-family: 'Poppins', sans-serif;
        }
        .login-container{
            background-color: white;
            width: 450px;
            padding: 1.5rem;
            margin: 50px auto;
            border-radius: 10px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.9);
        }
        .form{
            margin: 0.2rem;
        }
        .form-title{
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            padding: 1.3rem;
            margin-bottom: 0.4rem;
            
        }
        input{
            color: inherit;
            width: 100%;
            background-color: transparent;
            border: none;
            border-bottom: 1px solid #757575;
            padding-left: 1.5rem;
            font-size: 15px;
        }
        .input-grp{
            padding: 1% 0;
            position: relative;
        }
        .input-grp i{
            position: absolute;
            color: black;
        }
        input:focus{
            background-color: transparent;
            outline: transparent;
            border-bottom: 2px solid hsl(327, 90%, 28%);
        }
        input::placeholder{
            color: transparent;
        }
        label{
            color: #ff5555;
            position: relative;
            left: 1.2rem;
            top: -1.3rem;
            cursor: auto;
            transition: 0.3s ease all;
        }
        input:focus~label,input:not(:placeholder-shown)~label{
            top: -1.3rem;
            font-size: 15px;
            color: hsl(327, 90%, 28%);
        }
        .recover{
            text-align: right;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        .recover a{
            text-decoration: none;
            color: #ff5555;
        }
        .recover a:hover{
            color: #ff5555;
            text-decoration: underline;
        }
        .btn{
            font-size:  1.1rem;
            padding: 8px 0;
            border-radius: 5px;
            outline: none;
            border: none;
            background: #ff5555;
            color: white;
            cursor: pointer;
            transition: 0.9s;
        }
        .btn:hover{
            background: #07001f;
        }
        .login-link{
            display: flex;
            justify-content: space-around;
            padding: 0 4rem;
            margin-top: 0.9rem;
            font-weight: bold;
        }
        button{
            color: #ff5555;
            border: none;
            background-color: transparent;
            font-size: 1rem;
            font-weight: bold;
        }
        button:hover{
            text-decoration: underline;
            color: #ff5555;
        }
    </style>
</head>
<body>
    <!-- Signin Container -->
    <div class="login-container" id="signup" style="display: none;">
        <h1 class="form-title">Register</h1>
        <form method="post" action="">
            <div class="input-grp">
                <i class="fas fa-user"></i>
                <input type="text" name="fName" id="fName" placeholder="First Name" required>
                <label for="fname">First Name</label>
            </div>
            <div class="input-grp">
                <i class="fas fa-user"></i>
                <input type="text" name="lName" id="lName" placeholder="Last Name" required>
                <label for="lname">Last Name</label>
            </div>
            <div class="input-grp">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" id="email" placeholder="Email" required>
                <label for="email">Email</label>
            </div>
            <div class="input-grp">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" id="password" placeholder="Password" required>
                <label for="password">Password</label>
            </div>
            <input type="submit" value="Sign Up" class="btn" name="signup">
            <p class="login-link">Already have an account?
                <button id="signInButton">Sign In</button>
            </p> 
            
        </form>
    </div>

    <!-- Login Container -->
    <div class="login-container" id="signin">
        <h1 class="form-title">Sign In</h1>
        <form method="post" action="">
            
            <div class="input-grp">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" id="email" placeholder="Email" required>
                <label for="email">Email</label>
            </div>
            <div class="input-grp">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" id="password" placeholder="Password" required>
                <label for="password">Password</label>
            </div>
            <p class="recover">
                <a href="#">Forgot your password?</a>
            </p>
            <input type="submit" value="Sign In" class="btn" name="signin">
            <p class="login-link">Don't have an account?
                <button id="signUpButton">Sign Up</button>
            </p> 
            
        </form>
    </div>
    <script>
        const signUpButton = document.getElementById('signUpButton');
        const signInButton = document.getElementById('signInButton');
        const signInForm = document.getElementById('signin');
        const signUpForm = document.getElementById('signup');

        signUpButton.addEventListener('click', function(){
            signInForm.style.display = 'none';
            signUpForm.style.display = 'block';
        })
        signInButton.addEventListener('click', function(){
            signInForm.style.display = 'block';
            signUpForm.style.display = 'none';
        })
    </script>
</body>
</html>
