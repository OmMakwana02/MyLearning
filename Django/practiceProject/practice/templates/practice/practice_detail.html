{% extends 'base.html' %}

{% block title %}Practice Detail{% endblock %}

{% block content %}
  <h1 class="bg-sky-600 text-center text-3xl">Practice Detail Page.</h1>

  <div class="bg-sky-600 p-5 rounded-2xl m-4">

    <img class="rounded shadow-lg w-[100%]" src="{{ practice.image.url }}" alt="">
    <br>
    <h3 class="text-2xl">Test: {{ practice.name }}</h3>

    <p>Description: {{ practice.description }}</p>

    <p>Time Required: {{ practice.time_req }} hr(s)</p>
    
  </div>

  <div class="flex items-center justify-center h-full">
    <a href="{% url 'practice' %}">
      <button type="button" class="text-white bg-blue-700 hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-300 font-medium rounded-full text-sm px-5 py-2.5 text-center me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
        Back
      </button>
    </a>
  </div>

{% endblock %}
