{% extends "base.html" %}

{% block title %}MyTweet | Home{% endblock %}

{% block content %}

  <h1 class="text-white text-center mt-5">Welcome to myTweets</h1>

  <div class="text-white text-lg mt-4">
    {% if form.instance.pk %}
      <h2>Edit Tweet</h2>
    {% else %}
      <h2>Create Tweet</h2>
    {% endif %}

    <form method="post" enctype="multipart/form-data" class="text-white text-lg mt-4 form">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-warning" type="submit">Submit</button>
    </form>
    <br>
    <a href="{% url 'tweet_list' %}">Back to Home Page</a>
  </div>

{% endblock %}
