{% extends "base.html" %}

{% block title %}MyTweet | Home{% endblock %}

{% block content %}

  <h1 class="text-center mt-5">Are you sure you want to delete the tweet?</h1>

  <form method="post" class="text-center mt-5">
    {% csrf_token %}
    <button class="btn btn-danger">Delete</button>
    <a class="btn btn-success" href="{% url 'tweet_list' %}">Cancel</a>
  </form>

{% endblock %}
