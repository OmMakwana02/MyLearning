{% extends "base.html" %}

{% block content %}
  
  <h1 class="text-white text-center mt-5">Welcome to myTweets</h1>

  <a href="{% url 'tweet_create' %}" class="btn btn-primary m-2">Create a Tweet</a>

  <div class="container row gap-3 m-4">
    {% for tweet in tweets %}
    <div class="card" style="width: 18rem;">
      <img src="{{ tweet.photo.url }}" class="card-img-top my-2" alt="...">
      <div class="card-body">
        <h5 class="card-title">{{ tweet.user.username }}</h5>
        <p class="card-text">{{ tweet.text }}</p>
        {% if tweet.user == user %}
          <a href="{% url 'tweet_edit' tweet.id %}" class="btn btn-primary">Edit</a>
          <a href="{% url 'tweet_delete' tweet.id %}" class="btn btn-danger">Delete</a>
        {% endif %}
      </div>
    </div>
    {% endfor %}
  </div>

{% endblock %}
